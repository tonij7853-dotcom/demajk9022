name: Build & Release Dismod APK

on:
  push:
    tags:
      - 'v*'
    branches:
      - main
      - master
  workflow_dispatch:
    inputs:
      version_name:
        description: 'Version Name (e.g. 1.7.3)'
        required: false
        default: '1.7.3'
      changelog:
        description: 'Changelog / Release Notes'
        required: false
        default: 'General improvements and bug fixes.'

permissions:
  contents: write

jobs:
  build:
    name: Build & Publish Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          submodules: 'recursive'
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Accept Android SDK licenses
        run: yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Prepare Release Info
        id: prepare
        run: |
          mkdir -p release-artifacts

          TAG_NAME="${{ github.ref_name }}"
          if [[ "$TAG_NAME" == "main" || "$TAG_NAME" == "master" ]]; then
            TAG_NAME="v1.7.${{ github.run_number }}"
          fi

          VERSION_NAME="${TAG_NAME#v}"
          VERSION_CODE=$((1007000 + ${{ github.run_number }}))
          CHANGELOG="${{ github.event.inputs.changelog || github.event.head_commit.message || 'Latest Dismod update' }}"

          cat <<EOF > release-artifacts/version.json
          {
            "versionCode": $VERSION_CODE,
            "versionName": "$VERSION_NAME",
            "apkUrl": "https://github.com/${{ github.repository }}/releases/download/$TAG_NAME/dismod.apk",
            "changelog": "$CHANGELOG",
            "forceUpdate": false
          }
          EOF

          echo "tag_name=$TAG_NAME" >> $GITHUB_OUTPUT
          echo "version_name=$VERSION_NAME" >> $GITHUB_OUTPUT
          echo "version_code=$VERSION_CODE" >> $GITHUB_OUTPUT

      - name: Build APK with Gradle
        run: ./gradlew --no-daemon assembleDebug -PversionCode=${{ steps.prepare.outputs.version_code }} -PversionName=${{ steps.prepare.outputs.version_name }}

      - name: Copy Built APK
        run: cp app/build/outputs/apk/debug/app-debug.apk release-artifacts/dismod.apk

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.prepare.outputs.tag_name }}
          name: "Dismod ${{ steps.prepare.outputs.version_name }}"
          body: |
            ### Dismod Android Release (${{ steps.prepare.outputs.version_name }})
            ${{ github.event.inputs.changelog || github.event.head_commit.message || 'New release update for Dismod.' }}
            
            **Download:** [dismod.apk](https://github.com/${{ github.repository }}/releases/download/${{ steps.prepare.outputs.tag_name }}/dismod.apk)
          draft: false
          prerelease: false
          files: |
            release-artifacts/dismod.apk
            release-artifacts/version.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
